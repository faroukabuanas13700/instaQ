<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000">

  <title>extaze</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="style.css?v=17">
</head>


<body>

  <!-- CONNEXION / INSCRIPTION -->
  <section id="authScreen" class="auth-screen" hidden>
    <div class="auth-box">

      <img
        src="logo-extaze.png"
        alt="Logo extaze"
        class="auth-logo-image"
      >

      <p class="auth-subtitle">
        Partagez vos photos et vidéos
      </p>

      <form id="loginForm" class="auth-form">

        <input
          id="loginEmail"
          type="email"
          placeholder="Adresse e-mail"
          autocomplete="email"
          required
        >

        <input
          id="loginPassword"
          type="password"
          placeholder="Mot de passe"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          class="auth-primary"
        >
          Se connecter
        </button>

        <div
          class="auth-error"
          id="loginError"
        ></div>

      </form>

      <div class="auth-separator">
        <span>OU</span>
      </div>

      <form id="signupForm" class="auth-form">

        <input
          id="signupEmail"
          type="email"
          placeholder="Adresse e-mail"
          autocomplete="email"
          required
        >

        <input
          id="signupPassword"
          type="password"
          placeholder="Mot de passe"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <button
          type="submit"
          class="auth-secondary"
        >
          Créer un compte
        </button>

        <div
          class="auth-error"
          id="signupError"
        ></div>

      </form>

    </div>
  </section>


  <!-- APPLICATION -->
  <div id="app" hidden>

    <!-- BARRE SUPÉRIEURE -->
    <header class="topbar">

      <div class="topbar-inner">

        <div class="brand">
          extaze
        </div>

        <div class="top-actions">

          <button
            class="icon-btn"
            id="addPostBtn"
            type="button"
            aria-label="Ajouter une publication"
          >
            <svg viewBox="0 0 24 24">
              <rect x="3" y="3" width="18" height="18" rx="5"></rect>
              <path d="M12 8v8M8 12h8"></path>
            </svg>
          </button>

          <button
            class="icon-btn"
            id="logoutBtn"
            type="button"
            aria-label="Se déconnecter"
            title="Se déconnecter"
          >
            <svg viewBox="0 0 24 24">
              <path d="M10 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5"></path>
              <path d="M14 8l4 4-4 4"></path>
              <path d="M18 12H8"></path>
            </svg>
          </button>

          <button
            class="icon-btn"
            id="settingsBtn"
            type="button"
            aria-label="Paramètres"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 7h16M4 12h16M4 17h16"></path>
            </svg>
          </button>

        </div>

      </div>

    </header>


    <!-- PROFIL -->
    <main
      id="profilePage"
      class="profile-page"
    >

      <!-- BANNIÈRE -->
      <section class="cover">

        <div
          class="cover-media"
          id="coverMedia"
        >

          <img
            id="coverImg"
            alt="Bannière"
          >

          <video
            id="coverVideo"
            muted
            loop
            autoplay
            playsinline
          ></video>

        </div>

        <label
          class="cover-edit"
          for="coverInput"
        >
          Modifier
        </label>

        <input
          id="coverInput"
          type="file"
          accept="image/*,video/*"
          hidden
        >

      </section>


      <!-- ZONE PROFIL -->
      <section class="profile-info">

        <div class="profile-top">

          <!-- PHOTO PROFIL -->
          <div class="avatar-area">

            <label
              class="avatar-wrap"
              for="avatarInput"
              title="Modifier la photo de profil"
            >

              <img
                id="avatarImg"
                alt="Photo de profil"
              >

              <video
                id="avatarVideo"
                muted
                loop
                autoplay
                playsinline
              ></video>

              <span class="avatar-placeholder">
                👤
              </span>

              <span class="avatar-plus">
                +
              </span>

            </label>

            <input
              id="avatarInput"
              type="file"
              accept="image/*,video/*"
              hidden
            >

          </div>


          <!-- STATISTIQUES -->
          <section class="stats">

            <div>
              <strong id="postCount">
                0
              </strong>

              <span>
                publications
              </span>
            </div>

            <button
              class="stat-btn"
              id="followersBtn"
              type="button"
            >
              <strong id="followers">
                0
              </strong>

              <span>
                abonnés
              </span>
            </button>

            <button
              class="stat-btn"
              id="followingBtn"
              type="button"
            >
              <strong id="following">
                0
              </strong>

              <span>
                abonnements
              </span>
            </button>

          </section>

        </div>


        <!-- PSEUDO -->
        <div class="username-row">

          <h1 id="username"></h1>

          <span class="verified">
            ✓
          </span>

        </div>


        <!-- BIO -->
        <section class="bio">

          <strong id="displayName"></strong>

          <p id="bioText"></p>

          <a
            id="bioLink"
            href="#"
            target="_blank"
            rel="noopener"
          ></a>

        </section>


        <!-- BOUTONS -->
        <div class="profile-actions">

          <button
            class="primary-btn"
            id="editProfileBtn"
            type="button"
          >
            Modifier le profil
          </button>

          <button
            class="follow-btn"
            id="followBtn"
            type="button"
            hidden
          >
            S’abonner
          </button>

          <button
            class="secondary-btn"
            id="shareBtn"
            type="button"
          >
            Partager le profil
          </button>

        </div>

      </section>


      <!-- ONGLETS -->
      <nav
        class="tabs"
        aria-label="Publications"
      >

        <button
          class="tab active"
          type="button"
          data-filter="all"
          aria-label="Toutes les publications"
        >
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
          </svg>
        </button>

        <button
          class="tab"
          type="button"
          data-filter="image"
          aria-label="Photos"
        >
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
            <circle cx="8.5" cy="8.5" r="1.5"></circle>
            <path d="M21 15l-5-5L5 21"></path>
          </svg>
        </button>

        <button
          class="tab"
          type="button"
          data-filter="video"
          aria-label="Vidéos"
        >
          <svg viewBox="0 0 24 24">
            <rect x="3" y="3" width="18" height="18" rx="3"></rect>
            <path d="M10 8l6 4-6 4z"></path>
          </svg>
        </button>

      </nav>


      <!-- PUBLICATIONS -->
      <section
        class="grid"
        id="postGrid"
      ></section>

      <div
        class="empty"
        id="emptyState"
      >
        Aucune publication.
      </div>

    </main>


    <!-- PAGE EXPLORER -->
    <section
      id="explorePage"
      class="explore-page"
      hidden
    >

      <div class="explore-search-wrap">

        <div class="explore-search">

          <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="M16.5 16.5L21 21"></path>
          </svg>

          <input
            id="exploreSearchInput"
            type="search"
            placeholder="Rechercher"
            autocomplete="off"
          >

        </div>

      </div>

      <div
        id="exploreSearchResults"
        class="explore-search-results"
      ></div>

      <section
        id="exploreGrid"
        class="explore-grid"
      ></section>

      <div
        id="exploreEmpty"
        class="explore-empty"
      >
        Aucune publication disponible.
      </div>

    </section>


    <!-- BOUTON THÈME -->
    <button
      class="theme-btn"
      id="themeBtn"
      type="button"
      aria-label="Changer le thème"
    >
      ☾
    </button>


    <!-- BARRE BAS -->
    <nav class="bottom-nav">

      <button
        id="bottomHomeBtn"
        class="bottom-nav-btn active"
        type="button"
        aria-label="Accueil"
      >
        <svg viewBox="0 0 24 24">
          <path d="M3 11l9-8 9 8"></path>
          <path d="M5 10v10h14V10"></path>
        </svg>
      </button>

      <button
        id="bottomSearchBtn"
        class="bottom-nav-btn"
        type="button"
        aria-label="Rechercher"
      >
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="7"></circle>
          <path d="M16.5 16.5L21 21"></path>
        </svg>
      </button>

      <button
        id="bottomAddPostBtn"
        class="bottom-nav-btn"
        type="button"
        aria-label="Créer"
      >
        <svg viewBox="0 0 24 24">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <path d="M12 8v8M8 12h8"></path>
        </svg>
      </button>

      <button
        id="bottomProfileBtn"
        class="bottom-nav-btn"
        type="button"
        aria-label="Mon profil"
      >
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c1-5 4-7 8-7s7 2 8 7"></path>
        </svg>
      </button>

    </nav>


    <!-- PAGE ABONNÉS / ABONNEMENTS -->
    <section
      id="followListPage"
      class="follow-list-page"
      hidden
    >

      <header class="follow-page-header">

        <button
          id="followListBack"
          class="follow-page-back"
          type="button"
          aria-label="Retour"
        >
          ‹
        </button>

        <h2 id="followListTitle">
          Abonnés
        </h2>

        <div class="follow-page-header-space"></div>

      </header>


      <div class="follow-page-search">

        <svg viewBox="0 0 24 24">
          <circle
            cx="11"
            cy="11"
            r="7"
          ></circle>

          <path
            d="M16.5 16.5L21 21"
          ></path>
        </svg>

        <input
          id="followListSearch"
          type="search"
          placeholder="Rechercher"
          autocomplete="off"
        >

      </div>


      <div
        id="followListContent"
        class="follow-list-content"
      ></div>

    </section>


    <!-- MODIFICATION PROFIL -->
    <dialog
      class="dialog"
      id="profileDialog"
    >

      <form id="profileForm">

        <div class="dialog-head">

          <h2>
            Modifier le profil
          </h2>

          <button
            type="button"
            class="close"
            id="profileDialogClose"
            aria-label="Fermer"
          >
            ×
          </button>

        </div>

        <label>
          Nom

          <input
            id="nameInput"
            maxlength="40"
          >
        </label>

        <label>
          Nom d'utilisateur

          <input
            id="usernameInput"
            maxlength="30"
          >
        </label>

        <label>
          Bio

          <textarea
            id="bioInput"
            maxlength="150"
          ></textarea>
        </label>

        <label>
          Lien

          <input
            id="linkInput"
            type="url"
            placeholder="https://..."
          >
        </label>

        <div class="dialog-actions">

          <button
            type="button"
            class="secondary-btn"
            id="profileCancelBtn"
          >
            Annuler
          </button>

          <button
            type="submit"
            class="primary-btn"
          >
            Enregistrer
          </button>

        </div>

      </form>

    </dialog>


    <!-- INPUT PUBLICATION -->
    <input
      id="postInput"
      type="file"
      accept="image/*,video/*"
      hidden
    >


    <!-- VISIONNEUSE -->
    <div
      class="viewer"
      id="viewer"
      aria-hidden="true"
    >

      <button
        class="viewer-close"
        id="viewerClose"
        type="button"
        aria-label="Fermer"
      >
        ×
      </button>

      <button
        class="viewer-prev"
        id="viewerPrev"
        type="button"
        aria-label="Précédent"
      >
        ‹
      </button>

      <div
        class="viewer-content"
        id="viewerContent"
      ></div>

      <button
        class="viewer-next"
        id="viewerNext"
        type="button"
        aria-label="Suivant"
      >
        ›
      </button>

      <div
        class="viewer-caption"
        id="viewerCaption"
      ></div>

    </div>


    <!-- PAGE REELS -->
    <section
      id="reelsPage"
      class="reels-page"
      hidden
    >

      <div class="reels-stage">

        <video
          id="reelsVideo"
          class="reels-video"
          playsinline
          loop
          muted
        ></video>

        <div class="reels-top">

          <button
            id="reelsBackBtn"
            class="reels-back-btn"
            type="button"
            aria-label="Retour"
          >
            ←
          </button>

          <div class="reels-title">
            Reels
          </div>

        </div>


        <div class="reels-actions">

          <button
            id="reelsLikeBtn"
            class="reels-action-btn"
            type="button"
            aria-label="J’aime"
          >
            ♡
            <span id="reelsLikeCount">0</span>
          </button>

          <button
            id="reelsCommentBtn"
            class="reels-action-btn"
            type="button"
            aria-label="Commentaires"
          >
            ◯
            <span>0</span>
          </button>

          <button
            id="reelsShareBtn"
            class="reels-action-btn"
            type="button"
            aria-label="Partager"
          >
            ↗
          </button>

          
        </div>


        <div class="reels-bottom-info">

          <div class="reels-user-row">

            <div
              id="reelsAvatar"
              class="reels-avatar"
            >
              👤
            </div>

            <div
              id="reelsUsername"
              class="reels-username"
            >
              utilisateur
            </div>

            <button
              id="reelsFollowBtn"
              class="reels-follow-btn"
              type="button"
            >
              Suivre
            </button>

          </div>

          <div
            id="reelsCaption"
            class="reels-caption"
          ></div>

        </div>

      </div>


      <div class="reels-comment-bar">

        <input
          id="reelsCommentInput"
          type="text"
          placeholder="Ajoutez un commentaire..."
          autocomplete="off"
        >

      </div>

    </section>


    <!-- PROGRESSION -->
    <div
      class="upload-progress"
      id="uploadProgress"
    >

      <div
        class="upload-progress-text"
        id="uploadProgressText"
      >
        Envoi… 0%
      </div>

      <div class="upload-progress-bar">

        <div
          class="upload-progress-fill"
          id="uploadProgressFill"
        ></div>

      </div>

    </div>

  </div>


  <div
    class="toast"
    id="toast"
  ></div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./script.js?v=23"></script>

</body>
</html>
